apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend
        image: abuabakaralnour/flowersbackend:v8

        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
    	    name: backend-secret
